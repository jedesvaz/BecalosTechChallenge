<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Eventos en Formularios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        h2 {
            color: #333;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
        }

        #btn-submit { background-color: #457b9d; }
        #btn-click  { background-color: #e63946; }

        #resultado {
            background-color: #f1f1f1;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-line;
            font-size: 14px;
            min-height: 80px;
        }

        .etiqueta {
            font-weight: bold;
            margin-top: 10px;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <h2>Estudio: Eventos en Formularios</h2>

    <form id="miFormulario">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" placeholder="Escribe tu correo">

        <!-- BOTÓN 1: dispara el evento 'submit' del formulario -->
        <button type="submit" id="btn-submit">Enviar (submit)</button>
    </form>

    <!-- BOTÓN 2: dispara solo el evento 'click', fuera del form -->
    <button type="button" id="btn-click">Leer valores (click)</button>

    <div class="etiqueta">Resultado:</div>
    <div id="resultado">Aquí aparecerá la información...</div>

    <script>
      const resultado = document.getElementById('resultado');

// -------------------------------------------------------
// EVENTO SUBMIT
// Se dispara cuando el usuario envía el formulario (botón type="submit" o Enter)
// Sin preventDefault(), la página se recargaría automáticamente

document.getElementById('miFormulario').addEventListener('submit', (event) => {

    // SIN esta línea, la página se recargaría y perderías los datos
    event.preventDefault();

    // FORMA 1: acceder a los valores con querySelector
    const nombreQuerySelector = document.querySelector('#nombre').value;
    const correoQuerySelector = document.querySelector('#correo').value;

    // FORMA 2: acceder a los valores con event.target
    // event.target es el elemento que disparó el evento — en este caso el <form>
    // desde el form puedes acceder a sus campos por name
    const nombreEventTarget = event.target.nombre.value;
    const correoEventTarget = event.target.correo.value;

    resultado.textContent =
        `--- EVENTO: submit ---\n` +
        `[querySelector]  Nombre: ${nombreQuerySelector} | Correo: ${correoQuerySelector}\n` +
        `[event.target]   Nombre: ${nombreEventTarget} | Correo: ${correoEventTarget}\n\n` +
        `Nota: sin preventDefault() la página se recargaría aquí.`;
});

// -------------------------------------------------------
// EVENTO CLICK
// Se dispara solo cuando el usuario hace clic en ese botón específico
// No tiene el comportamiento de envío del formulario
// No necesita preventDefault() porque un button type="button" no recarga la página

document.getElementById('btn-click').addEventListener('click', () => {

    // Solo podemos usar querySelector aquí porque no hay event.target con el form
    const nombre = document.querySelector('#nombre').value;
    const correo = document.querySelector('#correo').value;

    resultado.textContent =
        `--- EVENTO: click ---\n` +
        `Nombre: ${nombre}\n` +
        `Correo: ${correo}\n\n` +
        `Nota: este botón está FUERA del form, solo dispara 'click', no 'submit'.\n` +
        `Por eso no necesita preventDefault().`;
});

// -------------------------------------------------------
// RESUMEN DE DIFERENCIAS
//
// submit:
//   - Lo dispara un button type="submit" o presionar Enter en un input
//   - Necesita preventDefault() para evitar que la página se recargue
//   - event.target apunta al <form>, desde donde puedes acceder a sus campos por name
//
// click:
//   - Lo dispara cualquier clic en el elemento
//   - NO recarga la página por sí solo (si el botón es type="button")
//   - event.target apunta al botón que se clickeó, no al form
//
// querySelector vs event.target:
//   - querySelector busca el elemento en todo el documento por selector CSS
//   - event.target es el elemento específico que disparó el evento
//   - En submit, event.target.nombreDelCampo.value es una forma más directa
//     de acceder a los campos del form sin buscar en el documento completo
    </script>
</body>
</html>
